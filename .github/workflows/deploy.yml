name: Test Deploy

on:
  push:
    branches: [main]

permissions:
  pages: write # ← Можно деплоить на Pages
  id-token: write # ← Безопасная аутентификация

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@4
      - uses: actions/setup-node@4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
